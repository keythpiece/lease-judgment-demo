notes:
- id: demo00000001
  title: 少額リースの社内取扱い（サンプル）
  category: 判定ルール
  applies_to: step1
  match_keywords: []
  content: |-
    当社の会計方針では、リース1件あたりの原資産価値が300万円以下（サンプル値）のリースは、
    重要性の観点から簡便的な処理を検討する。ただし複数資産をまとめた契約は1資産あたりで判断する。
    最終判断は経理部リース担当の承認を要する。
  updated_at: "2026-09-06T00:00:00+09:00"
- id: demo00000002
  title: 複合機契約の判定マニュアル（サンプル）
  category: 社内マニュアル
  applies_to: step2
  match_keywords:
  - 複合機
  - コピー機
  - プリンター
  content: |-
    複合機のカウンター料金契約は、機器利用部分（リース構成部分）と保守・印刷サービス部分が混在する。
    契約書に内訳がない場合は、販社に機器本体の参考価格を確認し、リース構成部分を分離して判定する。
    機器が設置場所固定・専用利用であれば、原則として特定資産ありと判断する。
  updated_at: "2026-09-06T00:00:00+09:00"
